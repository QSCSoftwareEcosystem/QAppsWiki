[project]
name = "qappswiki"
version = "0.1.0"
description = "Markdown-native validator, graph builder, analyzer, and MCP server for QAppsWiki."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QSC Software Thrust" }]
keywords = ["knowledge-graph", "wiki", "markdown", "provenance", "quantum-computing", "mcp"]
dependencies = [
    "pyyaml>=6",
    "networkx>=3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
# PDF->markdown converter for `qappswiki ingest`. Often installed standalone
# (e.g. `uv tool install markitdown-lightpdf`); the command is invoked via
# subprocess, so this extra is a convenience, not a hard import dependency.
ingest = ["markitdown-lightpdf>=0.1"]
dev = ["pytest>=8"]
all = ["mcp>=1.0", "markitdown-lightpdf>=0.1", "pytest>=8"]

[project.scripts]
qappswiki = "qappswiki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["qappswiki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
